function pixelText(text,x,y,scale=1){
 const str=String(text).toUpperCase(),pitch=7;
 const w=str.length*pitch+2;
 hf.clearRect(0,0,w+3,13);
 for(let i=0;i<str.length;i++){
  const glyph=glyphs[str[i]]||glyphs[' '];
  for(let row=0;row<7;row++)for(let col=0;col<5;col++){
   if(glyph[row][col]==='1'){
    const px=i*pitch+col+1,py=row+1;
    hf.fillStyle='rgba(45,71,130,0.36)';hf.fillRect(px+1,py+2,1,1);
    hf.fillStyle='rgba(225,232,247,0.42)';hf.fillRect(px+1,py,1,1);

 }

function fitScreen(){

 const safeLeft=parseFloat(getComputedStyle(document.body).paddingLeft)||0;
 const safeRight=parseFloat(getComputedStyle(document.body).paddingRight)||0;
 const scale=Math.min((vw-safeLeft-safeRight)/W,(vh-safeTop-safeBottom)/H);
 c.style.width=Math.max(1,Math.floor(W*scale))+'px';
 c.style.height=Math.max(1,Math.floor(H*scale))+'px';
}
