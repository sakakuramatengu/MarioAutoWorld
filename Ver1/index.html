<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Retro Auto Adventure</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#5c94fc}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}#hud{position:fixed;top:env(safe-area-inset-top,12px);left:8px;color:white;text-shadow:2px 2px #333;font:bold 12px monospace;pointer-events:none}#tip{position:fixed;bottom:14px;right:10px;color:#fff9;font:10px monospace;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="hud"></div><div id="tip">AUTO PLAY • TAP: PAUSE</div><script>
(()=>{'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),hud=document.querySelector('#hud');const W=256,H=440,ground=352,tile=16;canvas.width=W;canvas.height=H;ctx.imageSmoothingEnabled=false;let seed=2389,level=1,score=0,paused=false,cam=0,frames=0,finish=0,objects=[],particles=[],theme=0;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};let hero={x:28,y:ground-20,vy:0,on:true,dead:0};function init(){objects=[];cam=0;hero={x:28,y:ground-20,vy:0,on:true,dead:0};let x=170;for(let i=0;i<20;i++){x+=45+Math.floor(rnd()*48);let type=rnd();if(type<.28)objects.push({x,w:16,h:16,type:'enemy'});else if(type<.54)objects.push({x,w:16,h:24,type:'pipe'});else if(type<.75)objects.push({x,w:24,h:0,type:'gap'});else objects.push({x,w:16,h:16,type:'block',y:ground-54});}finish=x+120;theme=(level-1)%3}init();function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function cloud(x,y){rect(x,y+7,34,11,'#fff');rect(x+7,y,20,19,'#fff');rect(x+3,y+5,27,12,'#fff')}function background(){rect(0,0,W,H,theme===1?'#171d46':theme===2?'#4d5365':'#5c94fc');if(theme===0){for(let i=0;i<7;i++){let x=((i*79-cam*.18)%360+360)%360-40;cloud(x,55+(i%3)*33)}for(let i=0;i<6;i++){let x=((i*100-cam*.4)%390+390)%390-50;rect(x,ground-45,46,45,'#67c658');rect(x+8,ground-55,30,10,'#67c658');rect(x+12,ground-28,5,8,'#246c39');rect(x+28,ground-28,5,8,'#246c39')}}else{for(let i=0;i<14;i++){let x=((i*39-cam*.1)%310+310)%310;rect(x,45+(i*31)%170,3,3,theme===1?'#a1a2cc':'#b1b1bd')}}}
function drawHero(x,y){x=Math.round(x);y=Math.round(y);let walk=Math.floor(frames/7)%2;rect(x+4,y,10,4,'#d82c28');rect(x+2,y+4,14,3,'#d82c28');rect(x+4,y+7,11,6,'#f2ad70');rect(x+2,y+9,4,4,'#703719');rect(x+10,y+9,2,2,'#241a17');rect(x+4,y+13,10,6,'#dd3028');rect(x+6,y+15,6,5,'#2465c9');rect(x+3,y+16,3,4,'#f2ad70');rect(x+14,y+16,3,4,'#f2ad70');rect(x+4,y+20,5,3,'#653419');rect(x+10+(walk?1:0),y+20,5,3,'#653419')}
function drawObject(o){let x=Math.round(o.x-cam);if(x<-40||x>W+40)return;let y=ground-o.h;if(o.type==='gap')return;if(o.type==='pipe'){rect(x,y,o.w,o.h,'#197b36');rect(x-3,y,o.w+6,6,'#33b84d');rect(x+2,y+7,4,o.h-8,'#64d568');rect(x+o.w-4,y+7,3,o.h-8,'#145626')}if(o.type==='enemy'){rect(x+2,y+4,12,12,'#9b542a');rect(x+4,y,8,5,'#b66a37');rect(x+3,y+7,3,3,'#fff');rect(x+10,y+7,3,3,'#fff');rect(x+4,y+8,2,2,'#29251e');rect(x+10,y+8,2,2,'#29251e');rect(x,y+13,5,4,'#4d271b');rect(x+11,y+13,5,4,'#4d271b')}if(o.type==='block'){y=o.y;rect(x,y,16,16,'#b76530');rect(x+1,y+1,14,14,'#d48a46');rect(x,y+7,16,2,'#8d421f');rect(x+7,y,2,8,'#8d421f');rect(x+3,y+10,2,5,'#8d421f')}}
function floor(){for(let x=Math.floor(cam/16)*16;x<cam+W+16;x+=16){let gap=objects.some(o=>o.type==='gap'&&x>=o.x&&x<o.x+o.w);if(gap)continue;let px=Math.round(x-cam);rect(px,ground,16,H-ground,'#b46d34');rect(px,ground,16,5,theme===1?'#8687a8':'#59b53d');rect(px+1,ground+17,14,2,'#8b4b27');rect(px+7,ground+18,2,16,'#8b4b27');rect(px,ground+34,16,2,'#8b4b27');rect(px+3,ground+47,2,16,'#8b4b27')}}function obstacleAhead(){return objects.find(o=>o.type!=='block'&&o.x>=hero.x+8&&o.x<hero.x+55)}function tick(){frames++;let ob=obstacleAhead();if(hero.on&&ob&&ob.x-hero.x<38){hero.vy=-7.2;hero.on=false}hero.x+=1.12;hero.vy+=.32;hero.y+=hero.vy;let gap=objects.some(o=>o.type==='gap'&&hero.x+7>=o.x&&hero.x+7<o.x+o.w);if(!gap&&hero.y>=ground-23){hero.y=ground-23;hero.vy=0;hero.on=true}else if(gap&&hero.y>H+20){hero.dead++;score=Math.max(0,score-50);init()}if(hero.x>finish){level++;score+=500;seed+=97;init()}cam=Math.max(0,hero.x-70);score+=.05}function draw(){background();floor();for(const o of objects)drawObject(o);let fx=Math.round(finish-cam);if(fx>-20&&fx<W+20){rect(fx,ground-105,3,105,'#ddd');rect(fx+3,ground-104,23,15,'#4bb448');rect(fx+6,ground-101,12,5,'#fff')}drawHero(hero.x-cam,hero.y);hud.textContent='WORLD '+String(level).padStart(2,'0')+'  SCORE '+String(Math.floor(score)).padStart(6,'0');if(paused){rect(50,178,156,55,'#000a');ctx.fillStyle='#fff';ctx.font='bold 16px monospace';ctx.fillText('PAUSED',92,211)}}let last=0,acc=0;function loop(t){if(!last)last=t;acc+=Math.min(80,t-last);last=t;while(acc>=16.667){if(!paused)tick();acc-=16.667}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);canvas.addEventListener('click',()=>paused=!paused);document.addEventListener('visibilitychange',()=>{paused=document.hidden});})();
</script></body></html>
