 const frame=!hero.on?'jump':Math.floor(hero.anim/(hero.running?3:7))%2?'run1':'run2';
 const p=SPRITES[frame];
 // 16x16 character with hand-drawn red cap, face, moustache, blue dungarees, boots.
 for(let j=0;j<p.length;j++)for(let i=0;i<p[j].length;i++){
  const ch=p[j][i];if(ch==='.')continue;
  let color=PIX[ch];
  if(ch==='B'&&j>=8&&j<=13)color='#2266d1';
  rect(x+i*2,y+j*2,2,2,color);
 }
 // golden overall clasps
 rect(x+12,y+20,2,2,'#ffe066');rect(x+22,y+20,2,2,'#ffe066');
}

function draw(){bg();drawGround();for(const b of bridges){if(b.x+b.w<camera||b.x>camera+W)continue;for(let x=b.x;x<b.x+b.w;x+=T){if(!sprite('bridge',x-camera,b.y,16,8)){rect(x-camera,b.y,16,7,'#bd7133');rect(x-camera,b.y+7,16,1,'#653719');}}}for(const s of solids)drawSolid(s);for(const coin of coins)if(!coin.taken){let x=coin.x-camera;if(!sprite('coin',x,coin.y,10,16)){rect(x,coin.y,7,11,'#ffdd43');rect(x+2,coin.y+2,3,7,'#fff5a4');}}for(const p of pops){if(!sprite('coin',p.x-camera,p.y,10,16))rect(p.x-camera,p.y,9,14,'#ffd944');}for(const e of enemies)drawEnemy(e);let fx=finish-camera;if(fx>-32&&fx<W+32){if(!sprite('goal_flag',fx-8,352-160,31,160)){rect(fx,245,3,107,'#eee');rect(fx+3,246,24,15,'#49b34e');}}drawHero();drawHud();if(paused){rect(53,188,150,48,'#111');g.fillStyle='white';g.font='bold 16px monospace';g.fillText('PAUSED',95,217);}}
let last=0,acc=0;function loop(t){if(!last)last=t;acc+=Math.min(80,t-last);last=t;while(acc>=16.6667){if(!paused)tick();acc-=16.6667;}draw();requestAnimationFrame(loop);}generate();requestAnimationFrame(loop);c.addEventListener('click',()=>paused=!paused);document.addEventListener('visibilitychange',()=>paused=document.hidden);
})();
