*{box-sizing:border-box}body{margin:0;background:#4985d4;color:#fff;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;font-family:monospace}main{width:min(100%,680px);margin:auto;padding:24px 20px 18px;text-align:center}h1{margin:0 auto 22px;width:90%;max-width:540px}h1 img{display:block;width:100%;height:auto}nav{display:inline-flex;flex-direction:column;align-items:stretch;gap:2px;text-align:left}a{display:flex;align-items:center;gap:14px;min-height:44px;padding:4px 8px;color:#fff;text-decoration:none;font-size:clamp(16px,4.5vw,25px);font-weight:900;letter-spacing:1px;text-shadow:2px 2px #315a9b}a span{color:#b94700;text-shadow:1px 1px #672700;font-size:.85em}a:hover,a:focus-visible{background:#ffffff20;outline:2px dashed white}.land{position:relative;height:clamp(76px,19vw,140px);flex-shrink:0;overflow:hidden}.ground{position:absolute;bottom:0;width:100%;height:48px;background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAnUlEQVQ4T9WTsQ3CMBBFv8dgjhRsQZcZkBgIKTO4Y4sUzJExjB7SR8dJCXFBkdc4Z/ue7k5xmQa1y71qi9N51DRI+d7jNqosc218bHF9Sstc3wkR9g8m8CxMVwskskbY2y1giBkq6hLke10t/E8gqRHE6UbWkuFTAQEDgSzaJeDQ/7lFZi0ZvgQmPhhk3YLIr/Kh8JwdZPyEc1uG8xc10KNlCb7CYAAAAABJRU5ErkJggg==);background-size:24px 24px;image-rendering:pixelated}.hill{position:absolute;bottom:48px;left:4%;width:144px;image-rendering:pixelated}.mario{position:absolute;bottom:48px;left:15%;width:24px;image-rendering:pixelated}.bush{position:absolute;right:7%;bottom:48px;width:108px;height:28px;image-rendering:pixelated}@media(max-height:520px) and (orientation:landscape){main{padding:10px;display:flex;align-items:center;gap:24px;justify-content:center}h1{width:45%;margin:0}a{min-height:36px;font-size:18px}.land{height:65px}.ground{height:24px}.hill,.mario,.bush{bottom:24px}}

/* v6: reserve the full sprite height above the ground. */
body{padding-top:env(safe-area-inset-top,0px)}
.land{height:calc(120px + env(safe-area-inset-bottom,0px));overflow:hidden}
.ground{height:calc(48px + env(safe-area-inset-bottom,0px))}
.hill,.mario,.bush{bottom:calc(48px + env(safe-area-inset-bottom,0px))}
@media(max-height:520px) and (orientation:landscape){.land{height:calc(96px + env(safe-area-inset-bottom,0px))}.ground{height:calc(24px + env(safe-area-inset-bottom,0px))}.hill,.mario,.bush{bottom:calc(24px + env(safe-area-inset-bottom,0px))}}

/* v7: seamless running scene; menu above remains unchanged. */
.scenery{position:absolute;left:0;right:0;bottom:calc(48px + env(safe-area-inset-bottom,0px));height:72px;overflow:hidden;display:flex}
.scenery-unit{position:relative;flex:0 0 480px;height:72px;animation:scenery-scroll 8s linear infinite}
.scenery-unit .hill{left:24px;bottom:0}.scenery-unit .bush{left:264px;right:auto;bottom:0}
@keyframes scenery-scroll{to{transform:translateX(-100%)}}
.ground{animation:ground-scroll .4s linear infinite}
@keyframes ground-scroll{to{background-position:-24px 0}}
